name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Tier 0 needs no Lean at all: it pins what a clean result from the third
  # check is allowed to mean, against fixed forgery exports in the repository.
  # Seconds to run, so it gates everything else.
  tier0:
    name: tier 0 — offline scope tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: third-check scope and record integrity
        run: python3 -m pytest tests/test_third_check.py -q -k "not pipeline"
      - name: counterexample-search records
        # What a clean search result is allowed to mean, checked against the
        # committed records: no Lean, no box re-run, seconds.
        run: python3 -m pytest tests/test_counterexample.py -q
      - name: derivation-search records
        # PL-BOGUS must be recorded as refuted with the kernel's own verdict,
        # and a NO_DERIVATION result must carry the universe it searched.
        run: python3 -m pytest tests/test_derivation_search.py -q
      - name: triangulation records
        # The limit of the method must be stated in the record, and the
        # provenance of each rendering with it. See ASSUMPTIONS A1d.
        run: python3 -m pytest tests/test_triangulation.py -q
      - name: cross-record consistency
        # Facts recorded in two places must agree. The A01 mislabel survived
        # nine rounds because two records of one event were never compared.
        run: python3 -m pytest tests/test_record_consistency.py -q
      - name: kernel provenance and advisory wording
        # A clean advisory result must read as a statement about one list on
        # one date, never as "no known bugs". See ROADMAP 1.
        run: python3 -m pytest tests/test_provenance.py -q
      - name: specification passes — positivity, recursor, iota, safety
        # Each forgery must be rejected on the property it forges and must
        # pass the other two, UNCLASSIFIED must never count as a pass, and no
        # OK may relax the provenance gate. See ROADMAP 2a, 2b and 2c.
        run: >-
          python3 -m pytest tests/test_positivity.py tests/test_recursor.py
          tests/test_iota.py tests/test_safety.py -q
      - name: arena result record
        # kernel3's first external measurement (ROADMAP 6c). The result is
        # poor -- 23 of 72 bad tests accepted -- and these tests keep it poor
        # in the record until the checker improves.
        run: python3 -m pytest tests/test_arena_result.py tests/test_ndjson.py -q
      - name: con-leche evaluation record
        # The verified-kernel evaluation (ROADMAP 1.3b). Three of its four runs
        # are easy to overclaim: the A04 decline is the axiom layer rather than
        # the model proof, the A06 acceptance is negative, and the theorem is
        # conditional on a set theory not instantiated here.
        run: python3 -m pytest tests/test_conleche_evaluation.py -q
      - name: historical corpus records
        # The externally-set claims (ROADMAP 6a): a false claim must be
        # recorded false in the field the harness reads, no sign-off may be
        # claimed that nobody gave, and a search that cannot reach a
        # counterexample must say so rather than read as evidence.
        run: python3 -m pytest tests/test_history_corpus.py -q
      - name: portability
        # No file read may depend on the machine's locale, and no step of the
        # signing path may need a POSIX shell. Both were found by a reviewer
        # on Windows, not here.
        run: python3 -m pytest tests/test_portability.py -q

  # Tier 1 is the real verification: the whole core corpus through compile,
  # kernel replay, the third check and the auditor, plus the sign-off and its
  # drift detection. The auditor is interpreted rather than linked, so no C
  # toolchain is needed.
  tier1:
    name: tier 1 — core corpus and sign-off
    runs-on: ubuntu-latest
    needs: tier0
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      - name: cache the Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ hashFiles('lean-toolchain') }}

      - name: install elan and the pinned toolchain
        run: |
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: bootstrap (trusted reference + provenance baseline)
        # `bash ./script` rather than `./script`: the executable bit is not
        # tracked by git on Windows, so a commit made there drops mode 755 and
        # CI fails with "Permission denied" on a file that is perfectly fine.
        # tests/test_portability.py pins the bit; this makes CI not need it.
        run: bash ./scripts/bootstrap.sh

      - name: the committed baseline must reproduce
        # If this fails, the toolchain built different oleans than the recorded
        # run did, and every provenance verdict is about a different trusted
        # core. Worth failing CI over.
        run: cmp build/kernel_baseline.json reference/kernel_baseline.json

      - name: verify tiers 0-1
        # No sandbox user in CI, so submissions compile as the runner with the
        # resource limits still applied. Verdicts are unaffected.
        run: bash ./scripts/verify.sh 1

      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-results
          path: build/*.json
          if-no-files-found: warn

  # Tier 2 clones and builds a second kernel, which is slow; nightly rather
  # than per-push.
  tier2:
    name: tier 2 — second kernel (lean4lean)
    runs-on: ubuntu-latest
    needs: tier1
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ hashFiles('lean-toolchain') }}
      - run: |
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: bash ./scripts/bootstrap.sh
      - run: bash ./scripts/build-lean4lean.sh
      - run: bash ./scripts/verify.sh 2
